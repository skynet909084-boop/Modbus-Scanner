name: v1.2 Windows validation
on:
  pull_request:
  push:
    branches:
      - feature/write-value-dec-hex-toggle
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore
        run: dotnet restore ModbusScanner/ModbusScanner.csproj
      - name: Build Release x64
        run: dotnet build ModbusScanner/ModbusScanner.csproj -c Release -p:Platform=x64 --no-restore
      - name: Test local Modbus TCP simulator
        run: dotnet run --project SimulatorSmokeTests/SimulatorSmokeTests.csproj -c Release
      - name: Publish portable Windows x64
        run: dotnet publish ModbusScanner/ModbusScanner.csproj -c Release -r win-x64 --self-contained true -p:Platform=x64 -p:PublishSingleFile=true -o out
      - name: Upload validation artifact
        uses: actions/upload-artifact@v4
        with:
          name: modbus-scanner-v12-validation-win-x64
          path: out/
          if-no-files-found: error
